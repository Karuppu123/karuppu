<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Share Market Watchlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-3">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">NSE Live Watchlist</h1>
                <p id="status" class="text-xs text-slate-400">Updating...</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <input id="symbolInput" type="text" placeholder="NSE STOCKES"
                    onkeydown="if(event.key==='Enter') addStock()"
                    class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm w-full sm:w-44 focus:outline-none focus:border-emerald-400">
                <button onclick="addStock()"
                    class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm">
                    Add
                </button>
                <input id="excelInput" type="file" accept=".xlsx,.xls" class="hidden" onchange="uploadExcel()">
                <button onclick="document.getElementById('excelInput').click()"
                    class="bg-sky-500 hover:bg-sky-600 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm whitespace-nowrap">
                    Upload Excel
                </button>
                            <button onclick="cleanupInvalid()"
                    class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 font-semibold px-3 py-2 rounded-lg text-sm whitespace-nowrap">
                    Clean N/A
                </button>
                <!-- ADD THIS REFRESH BUTTON RIGHT HERE -->
                <button id="refreshBtn" onclick="fetchPrices(true)"
                    class="bg-slate-700 hover:bg-slate-600 text-white border border-slate-600 font-semibold px-3 py-2 rounded-lg text-sm whitespace-nowrap flex items-center gap-1.5 transition">
                    <span id="refreshIcon">↻</span> Refresh
                </button>
            </div>
        </div>


        <div class="flex flex-wrap items-center justify-between gap-2 mb-4 relative">
            <div class="flex flex-wrap items-center gap-2">
                <button id="tab-all" onclick="setTab('all')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 text-slate-950 transition">All Stocks</button>
                <button id="tab-gainers" onclick="setTab('gainers')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">▲ Top Gainers</button>
                <button id="tab-losers" onclick="setTab('losers')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">▼ Top Losers</button>
                <button id="removeSelectedBtn" onclick="removeSelected()"
                    class="hidden px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white transition">
                    Remove Selected (<span id="selectedCount">0</span>)
                </button>
            </div>

            <button onclick="toggleSortMenu()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700 transition">
                Sort ⇅
            </button>

            <div id="sortMenu" class="hidden absolute right-0 top-10 w-64 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-20 divide-y divide-slate-700">
                <div class="px-4 py-2.5 flex justify-between items-center">
                    <span class="font-bold text-sm text-white">Sort</span>
                    <button onclick="resetSort()" class="text-xs text-sky-400 hover:underline">Reset</button>
                </div>
                <button onclick="applySort('symbol')" class="w-full px-4 py-3 text-left text-sm flex items-center gap-3 hover:bg-slate-700/50">
                    <span class="font-bold text-slate-400 w-7">A-Z</span>
                    <span>Alphabetically</span>
                    <span id="arrow-symbol" class="ml-auto text-sky-400 font-bold"></span>
                </button>
                <button onclick="applySort('pct_change')" class="w-full px-4 py-3 text-left text-sm flex items-center gap-3 hover:bg-slate-700/50">
                    <span id="arrow-pct_change" class="font-bold text-sky-400 w-7">↓</span>
                    <span>Change</span>
                </button>
                <button onclick="applySort('price')" class="w-full px-4 py-3 text-left text-sm flex items-center gap-3 hover:bg-slate-700/50">
                    <span class="font-bold text-slate-400 w-7">LTP</span>
                    <span>Last Traded Price</span>
                    <span id="arrow-price" class="ml-auto text-sky-400 font-bold"></span>
                </button>
            </div>
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-x-auto shadow-lg">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="bg-slate-700/50 text-slate-300 text-xs uppercase">
                        <th class="py-3 px-4 w-10">
                            <input id="selectAllCheckbox" type="checkbox" onchange="toggleSelectAll(this)"
                                class="w-4 h-4 rounded accent-emerald-500 cursor-pointer">
                        </th>
                        <th class="py-3 px-4">Symbol</th>
                        <th class="py-3 px-4 text-right">Price (₹)</th>
                        <th class="py-3 px-4 text-right">High (₹ / %)</th>
                        <th class="py-3 px-4 text-right">Low (₹ / %)</th>
                        <th class="py-3 px-4 text-right">Change (₹ / %)</th>
                        <th class="py-3 px-4 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="watchlistBody" class="divide-y divide-slate-700 text-sm"></tbody>
            </table>
        </div>
    </div>
    <script>
        let stockData = [], currentTab = 'all', sortField = null, sortDir = null, isFetching = false;
        let selectedSymbols = new Set();

        function setTab(tab) {
            currentTab = tab;
            ['all', 'gainers', 'losers'].forEach(t => {
                const btn = document.getElementById('tab-' + t);
                btn.className = t === tab
                    ? 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 text-slate-950 transition'
                    : 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
            });
            renderTable();
        }

        function toggleSortMenu() {
            document.getElementById('sortMenu').classList.toggle('hidden');
        }

        function applySort(field) {
            if (sortField === field) {
                sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                sortField = field;
                sortDir = field === 'symbol' ? 'asc' : 'desc';
            }
            updateArrows();
            renderTable();
        }

        function resetSort() {
            sortField = null;
            sortDir = null;
            updateArrows();
            renderTable();
        }

        function updateArrows() {
            document.getElementById('arrow-symbol').innerText = sortField === 'symbol' ? (sortDir === 'asc' ? '↑' : '↓') : '';
            document.getElementById('arrow-pct_change').innerText = sortField === 'pct_change' ? (sortDir === 'desc' ? '↓' : '↑') : '↓';
            document.getElementById('arrow-price').innerText = sortField === 'price' ? (sortDir === 'desc' ? '↓' : '↑') : '';
        }

        function toggleRowSelection(fullSymbol, checkbox) {
            if (checkbox.checked) selectedSymbols.add(fullSymbol);
            else selectedSymbols.delete(fullSymbol);
            updateSelectionUI();
        }

        function toggleSelectAll(masterCheckbox) {
            document.querySelectorAll('.row-checkbox').forEach(cb => {
                cb.checked = masterCheckbox.checked;
                const sym = cb.getAttribute('data-symbol');
                if (masterCheckbox.checked) selectedSymbols.add(sym);
                else selectedSymbols.delete(sym);
            });
            updateSelectionUI();
        }

        function updateSelectionUI() {
            const btn = document.getElementById('removeSelectedBtn');
            document.getElementById('selectedCount').innerText = selectedSymbols.size;
            btn.classList.toggle('hidden', selectedSymbols.size === 0);
            const checkboxes = document.querySelectorAll('.row-checkbox');
            document.getElementById('selectAllCheckbox').checked =
                checkboxes.length > 0 && Array.from(checkboxes).every(cb => cb.checked);
        }

        function renderTable() {
            const tbody = document.getElementById('watchlistBody');
            let filtered = [...stockData];
            if (currentTab === 'gainers') filtered = filtered.filter(s => s.price !== 'N/A' && s.pct_change > 0);
            if (currentTab === 'losers') filtered = filtered.filter(s => s.price !== 'N/A' && s.pct_change < 0);

            if (sortField && sortDir) {
                filtered.sort((a, b) => {
                    if (sortField === 'symbol') {
                        return sortDir === 'asc' ? a.symbol.localeCompare(b.symbol) : b.symbol.localeCompare(a.symbol);
                    }
                    const valA = a[sortField] === 'N/A' ? -Infinity : Number(a[sortField]);
                    const valB = b[sortField] === 'N/A' ? -Infinity : Number(b[sortField]);
                    return sortDir === 'desc' ? valB - valA : valA - valB;
                });
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400">No stocks to display. Add a symbol or upload Excel.</td></tr>`;
                updateSelectionUI();
                return;
            }

            tbody.innerHTML = filtered.map(stock => {
                const isChecked = selectedSymbols.has(stock.full_symbol) ? 'checked' : '';
                const checkboxCell = `<td class="py-3.5 px-4"><input type="checkbox" data-symbol="${stock.full_symbol}" ${isChecked} onchange="toggleRowSelection('${stock.full_symbol}', this)" class="row-checkbox w-4 h-4 rounded accent-emerald-500 cursor-pointer"></td>`;
                const deleteCell = `<td class="py-3.5 px-4 text-center"><button onclick="removeSingle('${stock.full_symbol}')" class="text-slate-400 hover:text-rose-400 font-bold px-2 py-1 rounded hover:bg-slate-700/50">✕</button></td>`;

                if (stock.price === 'N/A') {
                    return `<tr class="hover:bg-slate-700/30 text-slate-500">${checkboxCell}<td class="py-3.5 px-4 font-semibold">${stock.symbol}</td><td class="py-3.5 px-4 text-right font-mono">N/A</td><td class="py-3.5 px-4 text-right">-</td><td class="py-3.5 px-4 text-right">-</td><td class="py-3.5 px-4 text-right">-</td>${deleteCell}</tr>`;
                }

                const isPos = stock.change >= 0;
                const color = isPos ? 'text-emerald-400' : 'text-rose-400';
                const sign = isPos ? '+' : '';
                return `<tr class="hover:bg-slate-700/30 transition">${checkboxCell}<td class="py-3.5 px-4 font-semibold">${stock.symbol}</td><td class="py-3.5 px-4 text-right font-mono">₹${Number(stock.price).toFixed(2)}</td><td class="py-3.5 px-4 text-right font-mono text-emerald-300">₹${Number(stock.day_high).toFixed(2)} (${stock.high_pct >= 0 ? '+' : ''}${stock.high_pct}%)</td><td class="py-3.5 px-4 text-right font-mono text-rose-300">₹${Number(stock.day_low).toFixed(2)} (${stock.low_pct >= 0 ? '+' : ''}${stock.low_pct}%)</td><td class="py-3.5 px-4 text-right font-mono font-semibold ${color}">${sign}${Number(stock.change).toFixed(2)} (${sign}${stock.pct_change}%)</td>${deleteCell}</tr>`;
            }).join('');
            updateSelectionUI();
        }

             async function fetchPrices(force = false) {
            if (isFetching) return;
            isFetching = true;
            const statusEl = document.getElementById('status');
            const refreshBtn = document.getElementById('refreshBtn');
            const refreshIcon = document.getElementById('refreshIcon');

            statusEl.innerText = 'Fetching latest NSE prices...';
            if (refreshBtn) {
                refreshBtn.disabled = true;
                refreshIcon.classList.add('animate-spin', 'inline-block');
            }

            try {
                const url = force ? '/api/prices?force=1' : '/api/prices';
                const res = await fetch(url);
                stockData = await res.json();
                renderTable();
                statusEl.innerText = `Updated at ${new Date().toLocaleTimeString()} • ${stockData.length} stocks`;
            } catch (err) {
                statusEl.innerText = 'Error loading prices. Retrying...';
            } finally {
                isFetching = false;
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshIcon.classList.remove('animate-spin');
                }
            }
        }

        async function addStock() {
            const input = document.getElementById('symbolInput');
            const symbol = input.value.trim();
            if (!symbol) return;
            input.value = '';
            await fetch('/api/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ symbol }) });
            fetchPrices();
        }

        async function removeSelected() {
            if (selectedSymbols.size === 0) return;
            const toRemove = Array.from(selectedSymbols);
            selectedSymbols.clear();
            updateSelectionUI();
            await fetch('/api/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ symbols: toRemove }) });
            fetchPrices();
        }

        async function removeSingle(fullSymbol) {
            selectedSymbols.delete(fullSymbol);
            await fetch('/api/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ symbols: [fullSymbol] }) });
            fetchPrices();
        }

        async function uploadExcel() {
            const fileInput = document.getElementById('excelInput');
            if (!fileInput.files.length) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            document.getElementById('status').innerText = 'Uploading Excel...';
            await fetch('/api/upload', { method: 'POST', body: formData });
            fileInput.value = '';
            fetchPrices();
        }

        async function cleanupInvalid() {
            document.getElementById('status').innerText = 'Removing N/A stocks...';
            const res = await fetch('/cleanup');
            const data = await res.json();
            selectedSymbols.clear();
            alert(`Removed ${data.removed.length} invalid stocks. ${data.remaining} remaining.`);
            fetchPrices();
        }

        fetchPrices();
        setInterval(fetchPrices, 60000 );
    </script>
</body>
</html>
